<!DOCTYPE html>
<html>
<head>
    <title>About - Mo Ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html">            
            <img src="assets/mo-logo.jpg" alt="Mo AI Logo" style="height: 60px; width: auto;">
        </a>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <div id="auth-area" style="display: flex; align-items: center; gap: 10px;">
            <a href="login.html" id="login-btn" style="background-color: white; color: #1e3a5f; padding: 8px 16px; border-radius: 20px; text-decoration: none;">Login</a>
            <span id="user-name" style="color: white; font-weight: bold; display: none;"></span>
        </div>
    </nav>
</header>

    <main>
        <h2>About Us</h2>
        <p>We are a team of passionate developers building amazing websites.</p>
        <p>Our mission is to make the web a better place, one project at a time.</p>
        <p>Founded in 2025, we believe in quality, creativity, and innovation.</p>
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Mo Ai. All rights reserved.</p> 
            <div class="social-links">
                <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

<script>
    // التحقق من حالة المستخدم
    const user = localStorage.getItem('moUser');
    const loginBtn = document.getElementById('login-btn');
    const userNameSpan = document.getElementById('user-name');

    console.log("Checking user:", user); // للتأكد أن الكود يعمل

    if (user) {
        loginBtn.style.display = 'none';
        userNameSpan.style.display = 'inline';
        userNameSpan.innerHTML = `👋 ${user} <a href="#" id="logout-btn" style="color: #f5e6a8; margin-left: 10px; font-weight: bold; text-decoration: none;">(Logout)</a>`;
        
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('moUser');
            window.location.reload();
        });
    } else {
        loginBtn.style.display = 'inline-block';
        userNameSpan.style.display = 'none';
    }
</script>
</body>
</html>
