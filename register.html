<!DOCTYPE html>
<html>
<head>
    <title>Register - Mo Ai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">
        <a href="index.html">
            <img src="assets/mo-logo.jpg" alt="Mo AI Logo" style="height: 50px; width: auto;">
        </a>
    </div>
    
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        
        <!-- هذا هو الجزء المسؤول عن Login/Logout -->
        <div id="auth-area" style="display: flex; align-items: center; gap: 10px; padding-left: 15px;">
            <a href="login.html" id="login-btn" style="background-color: white; color: #1e3a5f; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: bold;">Login</a>
            <span id="user-name" style="color: white; font-weight: bold; display: none;"></span>
        </div>
    </nav>
</header>

<main>
    <div class="login-container">
        <h2>Create Account</h2>
        <form id="regForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="login.html">Login</a></p>
        <div id="msg" style="color:red; margin-top:10px;"></div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
