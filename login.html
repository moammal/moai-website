<!DOCTYPE html>
<html>
<head>
    <title>Login - Mo Ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h2 { margin-bottom: 30px; color: #1e3a5f; }
        .login-container input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        .login-container button {
            width: 100%; padding: 12px; background-color: #1e3a5f;
            color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer;
        }
        .login-container button:hover { background-color: #14304a; }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <a href="index.html">
            <img src="assets/mo-logo.jpg" alt="Mo AI Logo" style="height: 50px; width: auto;">
        </a>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <div id="auth-area" style="display: flex; align-items: center; gap: 10px; padding-left: 15px;">
            <a href="login.html" id="login-btn" style="background-color: white; color: #1e3a5f; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: bold;">Login</a>
            <span id="user-name" style="color: white; font-weight: bold; display: none;"></span>
        </div>
    </nav>
</header>

    <main>
        <div class="login-container">
            <h2>Sign In</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p style="margin-top:15px; font-size:14px;">Don't have an account? <a href="register.html">Sign up</a></p>
            <div id="loginMessage" style="margin-top:15px; color:red;"></div>
        </div>
    </main>

    <footer><p>&copy; 2026 Mo Ai. All rights reserved.</p></footer>

    <!-- كود جافا سكريبت الذي يرسل البيانات -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // منع الصفحة من (الرفريش)
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('loginMessage');

            try {
                // إرسال البيانات للخادم
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // إذا نجح الدخول، احفظ الاسم وانتقل للصفحة الرئيسية
                    localStorage.setItem('moUser', data.user.username);
                    msgDiv.style.color = "green";
                    msgDiv.innerText = "Login successful! Redirecting...";
                    setTimeout(() => { window.location.href = "index.html"; }, 1000);
                } else {
                    // إذا فشل، أظهر رسالة الخطأ
                    msgDiv.innerText = data.message;
                }
            } catch(err) {
                msgDiv.innerText = "Connection error!";
            }
        });
    </script>
</body>
</html>
