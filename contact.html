<body style="background: linear-gradient(rgba(15, 32, 39, 0.1), rgba(15, 32, 39, 0.1)), url('assets/earth-bg.jpg'); background-size: 100% 100%; background-position: center; background-repeat: no-repeat; color: white; min-height: 100vh; display: flex; flex-direction: column;">

<header>
    <div class="logo">
