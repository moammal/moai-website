<!DOCTYPE html>
<html>
<head>
    <title>MO</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    header { background-color: #1e3a5f; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: white; text-decoration: none; margin-left: 25px; font-size: 18px; }
    .logo img { height: 60px; width: auto; }
    #user-name { color: white; font-weight: bold; }
    #auth-area { display: flex; align-items: center; gap: 10px; }
    .btn { background-color: white; color: #1e3a5f; padding: 14px 40px; border-radius: 30px; text-decoration: none; display: inline-block; font-size: 18px; }
    .index-page main { background: linear-gradient(rgba(30, 58, 95, 0.7), rgba(30, 58, 95, 0.7)), url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=1200'); background-size: cover; background-position: center; color: white; min-height: 70vh; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 20px;}
    footer { background-color: #1e3a5f; color: white; text-align: center; padding: 20px; font-size: 14px; }
    .social-links a { color: white; margin: 0 10px; font-size: 24px; }
</style>
    <!-- ضروري جداً لإظهار أيقونات السوشال ميديا الحقيقية -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body class="index-page">

<header>
    <div class="logo">
        <a href="index.html">
            <!-- تم إصلاح الرابط ووضع امتداد واحد فقط -->
            <img src="assets/mo-logo.jpg" alt="Mo AI Logo" style="height: 60px; width: auto;">
        </a>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <div id="auth-area" style="display: flex; align-items: center; gap: 10px;">
            <a href="login.html" id="login-btn" style="background-color: white; color: #1e3a5f; padding: 8px 16px; border-radius: 20px; text-decoration: none;">Login</a>
            <span id="user-name" style="color: white; font-weight: bold; display: none;"></span>
        </div>
    </nav>
</header>

    <!-- Main Content -->
    <main>
        <h2>Hi there</h2>
        <p>This is my website. welcome on board</p>
        <a href="services.html" class="btn">try it out</a>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Mo Ai. All rights reserved.</p>
            <div class="social-links">
                <!-- استبدلت الإيموجي بأيقونات حقيقية -->
                <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

<script>
    // التحقق من حالة المستخدم عند فتح الصفحة
    const user = localStorage.getItem('moUser');
    const loginBtn = document.getElementById('login-btn');
    const userNameSpan = document.getElementById('user-name');

    if (user) {
        // إذا كان المستخدم مسجل الدخول
        loginBtn.style.display = 'none';
        userNameSpan.style.display = 'inline';
        // نضيف زر تسجيل الخروج بجانب الاسم
        userNameSpan.innerHTML = `👋 ${user} <a href="#" id="logout-btn" style="color: #f5e6a8; margin-left: 10px; font-weight: bold; text-decoration: none;">(Logout)</a>`;
        
        // إضافة وظيفة للزر عند الضغط
        document.getElementById('logout-btn').addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.removeItem('moUser'); // مسح بيانات المستخدم
            window.location.reload(); // إعادة تحميل الصفحة لتختفي
        });
    } else {
        // إذا لم يكن مسجل الدخول
        loginBtn.style.display = 'inline-block';
        userNameSpan.style.display = 'none';
    }
</script>

</body>
</html>
